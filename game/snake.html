<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>贪吃蛇 Snake · 小游戏合集</title>
<link rel="stylesheet" href="./common.css">
<style>
  #board {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1 / 1;
    height: auto;
    border-radius: 6px;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 6px;
    justify-content: center;
    margin: 4px 0 18px;
  }
  .dpad button {
    appearance: none;
    border: 1px solid var(--line-2);
    background: var(--panel);
    color: var(--dim);
    border-radius: var(--radius);
    font-size: 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .dpad button:active {
    border-color: var(--accent);
    color: var(--accent);
  }
  .dpad .up { grid-area: 1 / 2; }
  .dpad .left { grid-area: 2 / 1; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down { grid-area: 3 / 2; }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a class="back" href="./"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>返回合集</a>
    <span class="brand">Game 01 / Snake</span>
  </div>

  <h1 class="title">贪吃蛇 <span class="en">SNAKE</span></h1>
  <p class="sub">吃掉食物变长，撞墙或咬到自己就结束。速度会随得分越来越快。</p>

  <div class="hud">
    <div class="hud-cell"><span class="hud-label">Score</span><span class="hud-value is-accent" id="score">0</span></div>
    <div class="hud-cell"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
    <div class="hud-cell"><span class="hud-label">Length</span><span class="hud-value" id="len">3</span></div>
    <div class="hud-cell"><span class="hud-label">Speed</span><span class="hud-value" id="spd">1</span></div>
  </div>

  <div class="stage overlay-host">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay" hidden>
      <div class="overlay-title" id="ovTitle">准备开始</div>
      <div class="overlay-desc" id="ovDesc">按空格开始</div>
    </div>
  </div>

  <div class="dpad">
    <button class="up" data-dir="up" aria-label="上">▲</button>
    <button class="left" data-dir="left" aria-label="左">◀</button>
    <button class="right" data-dir="right" aria-label="右">▶</button>
    <button class="down" data-dir="down" aria-label="下">▼</button>
  </div>

  <div class="hint">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向 ·
    <kbd>空格</kbd> 暂停 / 继续 · 手机上直接在棋盘上滑动，或点下面的方向键
  </div>
</div>

<script>
(function () {
  "use strict";

  var COLS = 20, ROWS = 20, CELL = 20;
  var W = COLS * CELL, H = ROWS * CELL;
  var BEST_KEY = "game.snake.best";

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovDesc = document.getElementById("ovDesc");
  var elScore = document.getElementById("score");
  var elBest = document.getElementById("best");
  var elLen = document.getElementById("len");
  var elSpd = document.getElementById("spd");

  var snake, dir, queue, food, score, best, dead, paused, started, stepMs, acc, last;

  function setupCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    dead = false;
    paused = false;
    started = false;
    stepMs = 150;
    acc = 0;
    placeFood();
    renderOverlay();
    syncHud();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (!snake.some(function (s) { return s.x === x && s.y === y; })) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function pushDir(nx, ny) {
    if (dead) return;
    if (!started) {
      started = true;
      acc = 0;
      overlay.hidden = true;
    }
    var lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (nx === -lastDir.x && ny === -lastDir.y) return;
    if (nx === lastDir.x && ny === lastDir.y) return;
    if (queue.length < 3) queue.push({ x: nx, y: ny });
  }

  function step() {
    if (queue.length) {
      var d = queue.shift();
      if (!(d.x === -dir.x && d.y === -dir.y)) dir = d;
    }

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die("撞到墙壁");

    var grow = food && head.x === food.x && head.y === food.y;
    var body = grow ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i < body.length; i++) {
      if (body[i].x === head.x && body[i].y === head.y) return die("咬到自己");
    }

    snake.unshift(head);
    if (grow) {
      score += 10;
      stepMs = Math.max(70, 150 - Math.floor(score / 50) * 10);
      placeFood();
      if (!food) return win();
      syncHud();
    } else {
      snake.pop();
    }
  }

  function die(reason) {
    dead = true;
    if (score > best) { best = score; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    syncHud();
    setOverlay("游戏结束", reason + " · 得分 " + score + " · 按空格重来", true);
  }

  function win() {
    dead = true;
    if (score > best) { best = score; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    syncHud();
    setOverlay("全屏通关", "棋盘已被填满，得分 " + score + " · 按空格重来", false);
  }

  function syncHud() {
    elScore.textContent = score;
    elBest.textContent = best;
    elLen.textContent = snake.length;
    elSpd.textContent = Math.max(1, 9 - Math.round((stepMs - 70) / 10));
  }

  function setOverlay(title, desc, danger) {
    ovTitle.textContent = title;
    ovTitle.className = "overlay-title" + (danger ? " is-danger" : "");
    ovDesc.textContent = desc;
    overlay.hidden = false;
  }

  function renderOverlay() {
    if (dead || paused) return;
    if (!started) {
      setOverlay("准备开始", "按任意方向键开始", false);
    } else {
      overlay.hidden = true;
    }
  }

  function togglePause() {
    if (dead) { reset(); return; }
    if (!started) { started = true; overlay.hidden = true; return; }
    paused = !paused;
    if (paused) setOverlay("已暂停", "按空格继续", false);
    else overlay.hidden = true;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function draw(t) {
    ctx.fillStyle = "#14171a";
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(255,255,255,0.035)";
    ctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL + 0.5); ctx.lineTo(W, i * CELL + 0.5); ctx.stroke();
    }

    if (food) {
      var pulse = 0.5 + 0.5 * Math.sin(t / 260);
      var pad = 3 + (1 - pulse) * 2.5;
      ctx.fillStyle = "#e5534b";
      roundRect(food.x * CELL + pad, food.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 4);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      roundRect(food.x * CELL + 7, food.y * CELL + 7, 4, 4, 2);
      ctx.fill();
    }

    for (var s = snake.length - 1; s >= 0; s--) {
      var seg = snake[s];
      var ratio = s / Math.max(1, snake.length - 1);
      var shade = Math.round(210 - ratio * 120);
      ctx.fillStyle = s === 0 ? "#ffd200" : "rgb(" + shade + "," + Math.round(shade * 0.87) + ",20)";
      var inset = s === 0 ? 1 : 2;
      roundRect(seg.x * CELL + inset, seg.y * CELL + inset, CELL - inset * 2, CELL - inset * 2, s === 0 ? 5 : 4);
      ctx.fill();
    }

    if (snake.length) {
      var head = snake[0];
      var hx = head.x * CELL + CELL / 2 + dir.x * (CELL / 2 - 5.5);
      var hy = head.y * CELL + CELL / 2 + dir.y * (CELL / 2 - 5.5);
      var px = -dir.y, py = dir.x;
      ctx.fillStyle = "#101214";
      for (var e = -1; e <= 1; e += 2) {
        ctx.fillRect(hx + px * 4.5 * e - 1.5, hy + py * 4.5 * e - 1.5, 3, 3);
      }
    }
  }

  function loop(t) {
    var dt = last ? Math.min(t - last, 200) : 0;
    last = t;
    if (started && !dead && !paused) {
      acc += dt;
      while (acc >= stepMs) {
        acc -= stepMs;
        step();
        if (dead) { acc = 0; break; }
      }
    }
    draw(t);
    requestAnimationFrame(loop);
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === " " || k === "Enter" || k.indexOf("Arrow") === 0) e.preventDefault();
    if (k === "ArrowUp" || k === "w" || k === "W") pushDir(0, -1);
    else if (k === "ArrowDown" || k === "s" || k === "S") pushDir(0, 1);
    else if (k === "ArrowLeft" || k === "a" || k === "A") pushDir(-1, 0);
    else if (k === "ArrowRight" || k === "d" || k === "D") pushDir(1, 0);
    else if (k === " " || k === "Enter") togglePause();
  });

  var dirMap = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  Array.prototype.forEach.call(document.querySelectorAll(".dpad button"), function (b) {
    b.addEventListener("click", function () {
      var d = dirMap[b.getAttribute("data-dir")];
      pushDir(d[0], d[1]);
    });
  });

  var tsx = 0, tsy = 0, tracking = false;
  canvas.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; tracking = true;
  }, { passive: true });

  canvas.addEventListener("touchmove", function (e) {
    if (!tracking || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - tsx;
    var dy = e.touches[0].clientY - tsy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) pushDir(dx > 0 ? 1 : -1, 0);
    else pushDir(0, dy > 0 ? 1 : -1);
    tracking = false;
  }, { passive: true });

  canvas.addEventListener("touchend", function () { tracking = false; }, { passive: true });

  canvas.addEventListener("click", function () { if (!started || dead) togglePause(); });

  best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) { best = 0; }
  setupCanvas();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
